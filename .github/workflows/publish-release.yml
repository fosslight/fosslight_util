# 1. Bump the package version
# 2. Upload a Python Package using Twine

name: Release fosslight_util

on:
  release:
    types: [published]

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Get Release
      uses: bruceadams/get-release@v1.3.2
      id: get_release
      env:
        GITHUB_TOKEN: ${{ github.token }}
    - name: Bump up version
      env:
        NEW_TAG: ${{ steps.get_release.outputs.tag_name }}
      run: |
        LAST_TWO_TAGS=$(git for-each-ref refs/tags/ --count=2 --sort=-v:refname --format="%(refname:short)")
        LAST_ONE=$(echo $LAST_TWO_TAGS | cut -d' ' -f 2)
        last_version=$(echo ${LAST_ONE//v/""})
        echo Last version: ${last_version}
        new_version=$(echo ${NEW_TAG//v/""})
        echo New version: ${new_version}
        git config --global user.name "github-actions[bot]"
        git config --global user.email "fosslight-dev@lge.com"
        sed -i "s/^version = \".*\"/version = \"$new_version\"/" pyproject.toml
    - name: Commit files
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "fosslight-dev@lge.com"
        git add pyproject.toml
        git commit -m "chore: bump package version"
    - name: Push changes
      uses: ad-m/github-push-action@v1.3.0
      with:
        github_token: ${{ secrets.TOKEN }}
        branch: main

  deploy:
    runs-on: ubuntu-latest
    needs: bump-version
    steps:
    - uses: actions/checkout@v7
      with:
        ref: main
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    - name: Build and publish
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      run: |
        python -m build
        twine upload dist/*
